<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agende seu horário</title>
  <meta name="theme-color" content="#0f0f10" />
  <link rel="icon" href="/img/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/booking.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <img src="/img/icon.svg" alt="" class="logo" />
      <h1 class="brand" id="shop-name">Barbearia</h1>
      <p class="muted" id="shop-address"></p>
      <div class="row hero-actions">
        <a class="btn ghost sm" id="shop-page">Página no Cidade 10</a>
        <a class="btn ghost sm" id="shop-whats" target="_blank" rel="noopener">WhatsApp</a>
        <button class="btn ghost sm" id="btn-my">Meus horários</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="upcoming" hidden></section>

    <section class="card booking" id="booking">
      <ol class="steps" id="steps">
        <li data-step="1">Serviço</li>
        <li data-step="2">Barbeiro</li>
        <li data-step="3">Horário</li>
        <li data-step="4">Seus dados</li>
      </ol>
      <div id="step-body"><div class="spinner"></div></div>
    </section>

    <section class="card" id="lookup" hidden></section>
  </main>

  <footer class="foot muted small">Agendamento online pelo <a href="/">Cidade 10</a> · <a href="/entrar/barbearia">Área do barbeiro</a></footer>

  <script type="module" src="/js/booking.js"></script>
</body>
</html>
